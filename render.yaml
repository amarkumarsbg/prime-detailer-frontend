# Render Blueprint — https://render.com/docs/blueprint-spec
# Set DATABASE_URL (Neon), JWT_SECRET, FRONTEND_ORIGIN, and Twilio vars in the Render dashboard.

services:
  - type: web
    name: prime-detailers-api
    runtime: node
    plan: free
    rootDir: backend
    # Include devDependencies so prisma CLI + typescript are available (NODE_ENV=production skips them otherwise).
    # Migrate once at build (not on every start) so rolling deploys don't fight for the same Postgres advisory lock.
    buildCommand: npm ci --include=dev && npm run db:generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon pooled URLs can't hold pg_advisory_lock; safe here because migrate runs only once per build.
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
